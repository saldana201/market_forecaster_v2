[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", ".venv", "venv"]

[tool.ruff.lint]
# Start CI with correctness-focused rules; expand style rules after the baseline is green.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["market_forecaster/tests"]
addopts = "-q"
