name: Refresh shared Demo Forecast Contracts

on:
  workflow_dispatch:
  schedule:
    # After U.S. market close, Tuesday-Saturday UTC (covers Monday-Friday sessions).
    - cron: '30 0 * * 2-6'

concurrency:
  group: demo-forecast-contract-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MARKET_FORECASTER_SUPABASE_URL: ${{ secrets.MARKET_FORECASTER_SUPABASE_URL }}
      MARKET_FORECASTER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MARKET_FORECASTER_SUPABASE_SERVICE_ROLE_KEY }}
      SHARED_CONTRACT_STORAGE_ENABLED: 'true'
      SHARED_AUTHORITY_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check shared-store secrets
        id: shared-secrets
        shell: bash
        run: |
          if [ -z "$MARKET_FORECASTER_SUPABASE_URL" ] || [ -z "$MARKET_FORECASTER_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Shared refresh skipped: required Supabase GitHub secrets are not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install runtime dependencies
        if: steps.shared-secrets.outputs.configured == 'true'
        run: pip install -r requirements.txt

      - name: Generate and publish shared Demo contracts
        if: steps.shared-secrets.outputs.configured == 'true'
        run: |
          python -m market_forecaster.scripts.refresh_demo_contracts --period 5y --folds 4

      - name: Verify shared Demo cache
        if: steps.shared-secrets.outputs.configured == 'true'
        run: |
          python -m market_forecaster.scripts.check_demo_cache --fail-if-incomplete --require-shared --compact
