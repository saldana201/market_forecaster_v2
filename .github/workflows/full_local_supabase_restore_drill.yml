name: Full local Supabase restore drill

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'GitHub Actions run ID from Backup Market Forecaster Supabase'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: marketforecaster-local-supabase-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BACKUP_PASSPHRASE: ${{ secrets.MARKET_FORECASTER_BACKUP_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require backup passphrase
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo '::error::Repository secret MARKET_FORECASTER_BACKUP_PASSPHRASE is required.'
            exit 1
          fi
          echo "::add-mask::$BACKUP_PASSPHRASE"

      - name: Download encrypted backup artifact
        uses: actions/download-artifact@v4
        with:
          name: marketforecaster-supabase-backup
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ github.token }}
          path: encrypted-backup

      - name: Decrypt and verify backup
        shell: bash
        run: |
          set -euo pipefail
          encrypted="$(find encrypted-backup -maxdepth 1 -type f -name '*.tar.gz.gpg' -print -quit)"
          if [ -z "$encrypted" ]; then
            echo '::error::Encrypted backup artifact was not found.'
            exit 1
          fi
          mkdir -p restored-files
          archive='restored-files/backup.tar.gz'
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output "$archive" "$encrypted"
          tar -C restored-files -xzf "$archive"
          rm -f "$archive"
          (cd restored-files && sha256sum --check SHA256SUMS)

      - name: Start disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore-lab
          npx --yes supabase@latest init --workdir restore-lab
          npx --yes supabase@latest start --workdir restore-lab
          status="$(npx --yes supabase@latest status --workdir restore-lab -o env)"
          printf '%s\n' "$status" > restore-lab/status.env
          DB_URL="$(printf '%s\n' "$status" | sed -n 's/^DB_URL="\{0,1\}\(.*\)"\{0,1\}$/\1/p' | head -n 1)"
          DB_URL="${DB_URL%\"}"
          DB_URL="${DB_URL#\"}"
          if [ -z "$DB_URL" ]; then
            echo '::error::Could not resolve the disposable local Supabase database URL.'
            exit 1
          fi
          echo "::add-mask::$DB_URL"
          echo "LOCAL_RESTORE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
          date +%s > restore-lab/restore_started_epoch

      - name: Prepare roles for disposable local restore
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("restored-files/roles.sql")
          target = Path("restored-files/roles.local.sql")
          skipped = 0
          output = []

          for line in source.read_text(encoding="utf-8").splitlines():
              if re.match(r'^ALTER ROLE\s+.+\s+SET\s+', line, flags=re.IGNORECASE):
                  output.append(
                      "-- skipped in disposable local restore because the local "
                      "Supabase stack owns server-level role settings: " + line
                  )
                  skipped += 1
              else:
                  output.append(line)

          target.write_text("\n".join(output) + "\n", encoding="utf-8")
          print(f"Prepared local roles file; skipped {skipped} server-level role setting statements.")
          PY

      - name: Restore encrypted production backup into disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          psql --single-transaction --variable ON_ERROR_STOP=1 --file restored-files/roles.local.sql --file restored-files/schema.sql --command 'SET session_replication_role = replica' --file restored-files/data.sql --file restored-files/history_schema.sql --file restored-files/history_data.sql --dbname "$LOCAL_RESTORE_DB_URL"

      - name: Verify restored Market Forecaster data
        shell: bash
        run: |
          set -euo pipefail
          structures="$(psql "$LOCAL_RESTORE_DB_URL" -Atc "select concat_ws(',',to_regclass('public.subscriptions'),to_regclass('public.user_api_keys'),to_regclass('public.shared_forecast_contracts'),to_regclass('auth.users'));" )"
          for expected in subscriptions user_api_keys shared_forecast_contracts users; do
            if [[ "$structures" != *"$expected"* ]]; then
              echo "::error::Restore verification did not find expected structure: $expected"
              exit 1
            fi
          done
          ready_contracts="$(psql "$LOCAL_RESTORE_DB_URL" -Atc "select count(*) from public.shared_forecast_contracts where status='READY';")"
          if [ "$ready_contracts" -lt 14 ]; then
            echo "::error::Expected at least 14 READY forecast contracts after restore; found $ready_contracts."
            exit 1
          fi
          subscriptions="$(psql "$LOCAL_RESTORE_DB_URL" -Atc "select count(*) from public.subscriptions;")"
          api_keys="$(psql "$LOCAL_RESTORE_DB_URL" -Atc "select count(*) from public.user_api_keys;")"
          users="$(psql "$LOCAL_RESTORE_DB_URL" -Atc "select count(*) from auth.users;")"
          completed="$(date +%s)"
          started="$(cat restore-lab/restore_started_epoch)"
          rto_seconds="$((completed - started))"
          {
            echo "READY_CONTRACTS=$ready_contracts"
            echo "RESTORED_SUBSCRIPTIONS=$subscriptions"
            echo "RESTORED_API_KEYS=$api_keys"
            echo "RESTORED_AUTH_USERS=$users"
            echo "RESTORE_RTO_SECONDS=$rto_seconds"
          } >> "$GITHUB_ENV"
          echo 'Disposable local Supabase restore verification passed.'

      - name: Stop and destroy disposable local Supabase
        if: always()
        shell: bash
        run: |
          set +e
          npx --yes supabase@latest stop --workdir restore-lab --no-backup
          rm -rf restored-files encrypted-backup restore-lab
          unset BACKUP_PASSPHRASE LOCAL_RESTORE_DB_URL

      - name: Write full restore-drill summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Market Forecaster full local Supabase restore drill'
            echo ''
            echo '- Backup run: ${{ inputs.backup_run_id }}'
            echo '- Backup decryption + SHA-256 validation: passed'
            echo '- Disposable local Supabase startup: passed'
            echo '- Full SQL restore: passed'
            echo "- Auth users restored: $RESTORED_AUTH_USERS"
            echo "- Subscriptions restored: $RESTORED_SUBSCRIPTIONS"
            echo "- API keys restored: $RESTORED_API_KEYS"
            echo "- READY Forecast Contracts restored: $READY_CONTRACTS"
            echo "- Measured restore verification time: ${RESTORE_RTO_SECONDS}s"
            echo '- Disposable stack destroyed after verification'
          } >> "$GITHUB_STEP_SUMMARY"