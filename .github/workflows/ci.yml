name: market-forecaster-ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            market_forecaster/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q market_forecaster
      - name: Ruff correctness checks
        run: ruff check market_forecaster
      - name: Unit tests
        env:
          MARKET_FORECASTER_ENV: test
        run: pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker build -f market_forecaster/Dockerfile -t market-forecaster:${{ github.sha }} .; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Container build attempt $attempt failed; waiting before retry."
              sleep $((attempt * 20))
            fi
          done
          echo "::error::API container build failed after 3 attempts."
          exit 1
