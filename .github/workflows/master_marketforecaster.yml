# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - marketforecaster

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          python -m streamlit --version
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Refresh Demo Forecast Contract cache
        run: |
          source antenv/bin/activate
          python -m market_forecaster.scripts.refresh_demo_contracts --period 5y --folds 4
          python -m market_forecaster.scripts.check_demo_cache --compact

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          include-hidden-files: true
          path: |
            .
            !antenv/
            !.git/
            !.patch_backups/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6B5948FF98A541699160F65E91D4A6C4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5B9FC7F1D0CA4531A6678659F1C575E9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F60C40A3C2E74BF1BF6E1EE01CCA149C }}

      - name: Configure Azure App Service Python runtime
        shell: bash
        run: |
          RESOURCE_GROUP="$(az webapp list --query "[?name=='marketforecaster'].resourceGroup | [0]" -o tsv)"
          if [ -z "$RESOURCE_GROUP" ]; then
            echo "Could not resolve Azure resource group for marketforecaster."
            exit 1
          fi
          echo "Configuring marketforecaster in resource group: $RESOURCE_GROUP"

          # The deployment artifact intentionally excludes the GitHub Actions
          # virtualenv. Force App Service/Oryx to install requirements.txt on
          # the Azure host during deployment.
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name marketforecaster \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true

          # Market Forecaster is a Streamlit app, not a Flask/Django app.
          # Use python -m so the package installed by Oryx is resolved from
          # the deployment environment rather than relying on a global
          # "streamlit" executable being present on PATH. Streamlit also
          # requires WebSockets for its browser session channel.
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name marketforecaster \
            --linux-fx-version "PYTHON|3.12" \
            --web-sockets-enabled true \
            --startup-file "python -m streamlit run market_forecaster/app.py --server.address 0.0.0.0 --server.port 8000 --server.headless true"

      - name: Wait for App Service configuration restart to settle
        shell: bash
        run: |
          echo "Waiting for Azure SCM/app containers to settle after configuration changes..."
          sleep 60

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'marketforecaster'
          slot-name: 'Production'
          